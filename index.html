<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | My Homepage</title>
    <style>
        body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; }
        
        /* 核心布局：Flexbox */
        .container { display: flex; min-height: 100vh; }
        
        /* 分栏样式 */
        .column { flex: 1; padding: 40px; overflow-y: auto; }
        
        /* 左侧中文栏 */
        .cn-side { background-color: #ffffff; border-right: 1px solid #eee; }
        
        /* 右侧英文栏 */
        .en-side { background-color: #f9f9f9; color: #555; }

        /* 响应式：手机端自动变成上下堆叠 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .cn-side { border-right: none; border-bottom: 1px solid #eee; }
        }

        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .section { margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 中文内容 -->
    <div class="column cn-side">
        <h1>你好，我是 [智志洋]</h1>
        <div class="section">
            <h3>关于我</h3>
            <p>我是一名热衷于开源技术的开发者。</p>
        </div>
        <div class="section">
            <h3>专业技能</h3>
            <ul>
                <li>Python / JavaScript</li>
                <li>数据分析与可视化</li>
            </ul>
        </div>
    </div>

    <!-- 英文内容 -->
    <div class="column en-side">
        <h1>Hi, I'm [Zhiyang ZHI]</h1>
        <div class="section">
            <h3>About Me</h3>
            <p>I am a developer passionate about open-source technologies.</p>
        </div>
        <div class="section">
            <h3>Skills</h3>
            <ul>
                <li>Python / JavaScript</li>
                <li>Data Analysis & Visualization</li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
